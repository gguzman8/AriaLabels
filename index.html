
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accessibility exercise</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <header>
    <h1>Accessibility exercises</h1>
  </header>

  <main>
    <h2>ARIA exercise 1 (after)</h2>

    <form>
      <fieldset>
        <legend>Contact us</legend>

        <div class="form-control">
          <label for="name">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <span class="sr-only">Name</span>
          </label>
          <input type="text" id="name" aria-label="Name" />
        </div>

        <div class="form-control">
          <label for="email">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            <span class="sr-only">Email</span>
          </label>
          <input type="email" id="email" aria-label="Email" />
        </div>

        <div class="form-control">
          <label for="message">
            <i class="fa-solid fa-comment" aria-hidden="true"></i>
            <span class="sr-only">Message</span>
          </label>
          <textarea
            id="message"
            cols="30"
            rows="10"
            aria-label="Message"
          ></textarea>
        </div>

        <button type="submit" aria-label="Send">
          <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
        </button>
      </fieldset>
    </form>

    <p>
      <i class="fa-solid fa-phone" aria-hidden="true"></i>
      +52 (333) 45 34 567
    </p>
  </main>
</body>
</html>

<style>
body {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background-color: #f4f7f8;
  color: #333;
  margin: 0;
  padding: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Header */
h1 {
  color: #2a9d8f;
  margin-bottom: 20px;
}

/* Form container */
form {
  background-color: #fff;
  padding: 25px 30px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  max-width: 450px;
  width: 100%;
}

/* Fieldset and legend */
fieldset {
  border: 2px solid #2a9d8f;
  border-radius: 8px;
  padding: 20px;
}

legend {
  font-weight: bold;
  color: #264653;
  padding: 0 10px;
}

/* Form controls */
.form-control {
  display: flex;
  flex-direction: column;
  margin-bottom: 15px;
}

label {
  margin-bottom: 6px;
  font-weight: 500;
  color: #264653;
}

/* Inputs and textarea */
input[type="text"],
textarea {
  padding: 10px;
  border: 2px solid #757575;
  border-radius: 6px;
  font-size: 1em;
  transition: border-color 0.3s, box-shadow 0.3s;
}

input[type="text"]:focus,
textarea:focus {
  border-color: #1E7167;
  box-shadow: 0 0 5px rgba(42, 157, 143, 0.3);
  outline: none;
}

/* Submit button */
input[type="submit"] {
  background-color: #20796F;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 10px 20px;
  font-size: 1em;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

input[type="submit"]:hover {
  background-color: #21867a;
}

/* Contact info */
img {
  vertical-align: middle;
  width: 20px;
  margin-right: 8px;
  margin-top: 25px;
}

body > img + text,
body > img + span,
body > img + div {
  display: inline-block;
  vertical-align: middle;
}
</style>
